<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Drift — Build Your Own 2D Game Engine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050510;
    font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none;
    -webkit-user-select: none; user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 16px; color: #7df9ff; font-size: 15px;
    letter-spacing: 1px; pointer-events: none; text-shadow: 0 0 8px #00e5ff; }
  #hud .hi { color: #ffd257; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #eaf6ff; pointer-events: none; padding: 20px; }
  #overlay h1 { font-size: clamp(34px, 8vw, 72px); letter-spacing: 6px;
    color: #7df9ff; text-shadow: 0 0 24px #00e5ff, 0 0 60px #0088ff; }
  #overlay p { margin-top: 14px; font-size: clamp(14px, 3vw, 19px); color: #9fb3c8;
    max-width: 520px; line-height: 1.6; }
  #overlay .blink { margin-top: 26px; color: #ffd257; font-size: 17px;
    letter-spacing: 2px; animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #overlay.hidden { display: none; }
  #fireBtn { position: fixed; right: 26px; bottom: 30px; width: 84px; height: 84px;
    border-radius: 50%; border: 2px solid #ff5d8f; color: #ff8fb0;
    background: rgba(255, 93, 143, 0.08); font-size: 14px; letter-spacing: 1px;
    display: none; align-items: center; justify-content: center; }
  body.touch #fireBtn.playing { display: flex; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">SCORE <span id="score">0</span> &nbsp;•&nbsp; LIVES <span id="lives">3</span><br><span class="hi">BEST <span id="hi">0</span></span></div>
<div id="overlay">
  <h1>NEON DRIFT</h1>
  <p>A tiny game engine in one HTML file: fixed-timestep loop, entities,
     collision, particles, parallax stars, synth audio.<br>
     Built for <b>Build Your Own Everything</b> — games-graphics path.</p>
  <div class="blink" id="prompt">PRESS SPACE OR TAP TO START</div>
</div>
<div id="fireBtn">FIRE</div>

<script>
'use strict';
/* =====================================================================
   NEON DRIFT — a minimal 2D game engine in a single file.
   Engine systems (each maps to a concept in topics/2d-game-engine):
     1. Fixed-timestep game loop  -> update() runs at 120 Hz no matter
        the display refresh rate. Rendering is decoupled from simulation.
     2. Entity system              -> plain objects in arrays; each has
        pos/vel/radius/update/draw. No inheritance, just data + functions.
     3. Input                     -> keyboard state map + touch steering.
     4. Collision                  -> circle-vs-circle, O(n*m) broadphase
        is fine at this scale (spatial hashing is a stretch exercise).
     5. Particles                  -> pooled short-lived entities for
        explosions and thruster trails.
     6. Parallax starfield         -> 3 layers scrolling at different
        speeds = cheap depth.
     7. Synth audio                -> WebAudio oscillators, no assets.
     8. Game states                -> menu / playing / gameover machine.
   ===================================================================== */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const promptEl = document.getElementById('prompt');
const fireBtn = document.getElementById('fireBtn');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const hiEl = document.getElementById('hi');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };

/* ---------------- 7. Synth audio (WebAudio, zero assets) ---------------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, type, vol, slide) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), ac.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
const sfx = {
  shoot:    () => beep(880, 0.08, 'square', 0.05, 220),
  explode:  () => beep(160, 0.35, 'sawtooth', 0.10, 40),
  hit:      () => beep(110, 0.5, 'sawtooth', 0.12, 30),
  wave:     () => beep(520, 0.15, 'sine', 0.07, 780),
};

/* ---------------- 3. Input: keyboard + touch ---------------- */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' || e.code === 'Enter') primaryAction();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let touchSteer = null; // {x} in CSS px, or null
if ('ontouchstart' in window) document.body.classList.add('touch');
canvas.addEventListener('pointerdown', e => {
  audio();
  if (e.pointerType === 'touch') touchSteer = { x: e.clientX };
  primaryAction();
});
canvas.addEventListener('pointermove', e => {
  if (touchSteer) touchSteer.x = e.clientX;
});
window.addEventListener('pointerup', () => { touchSteer = null; });
fireBtn.addEventListener('pointerdown', e => { e.stopPropagation(); audio(); shoot(); });

/* ---------------- 8. Game states ---------------- */
let state = 'menu'; // menu | playing | gameover
let score = 0, lives = 3, wave = 0;
let hi = parseInt(localStorage.getItem('neonDriftHi') || '0', 10) || 0;
hiEl.textContent = hi;

function primaryAction() {
  audio();
  if (state === 'menu') startGame();
  else if (state === 'gameover') startGame();
  else if (state === 'playing') shoot();
}

/* ---------------- 2. Entities ---------------- */
let ship, bullets, asteroids, particles, stars;
function newShip() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: -Math.PI / 2,
           radius: 12, invuln: 2.0, thrusting: false };
}
function startGame() {
  ship = newShip();
  bullets = []; asteroids = []; particles = [];
  score = 0; lives = 3; wave = 0;
  state = 'playing';
  overlay.classList.add('hidden');
  document.body.classList.add('playing');
  fireBtn.classList.add('playing');
  nextWave();
  updateHUD();
}
function updateHUD() {
  scoreEl.textContent = score; livesEl.textContent = lives;
  if (score > hi) { hi = score; localStorage.setItem('neonDriftHi', String(hi)); }
  hiEl.textContent = hi;
}

/* ---------------- 6. Parallax starfield ---------------- */
function initStars() {
  stars = [];
  for (let i = 0; i < 140; i++)
    stars.push({ x: Math.random() * W, y: Math.random() * H,
                 z: rand(0.15, 1), r: rand(0.5, 1.8) });
}
initStars();

function spawnAsteroid(size, x, y) {
  const speed = rand(30, 90) * (4 - size); // smaller = faster
  const a = rand(0, TAU);
  const radius = [0, 14, 24, 38][size];
  const verts = [];
  const n = 9 + (Math.random() * 4 | 0);
  for (let i = 0; i < n; i++) verts.push(rand(0.75, 1.15));
  asteroids.push({
    x: x !== undefined ? x : (Math.random() < 0.5 ? rand(0, W) : (Math.random() < 0.5 ? -40 : W + 40)),
    y: y !== undefined ? y : (x !== undefined ? y : (Math.random() < 0.5 ? rand(0, H) : (Math.random() < 0.5 ? -40 : H + 40))),
    vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
    radius, size, verts, rot: rand(0, TAU), vr: rand(-1.5, 1.5),
  });
}
function nextWave() {
  wave++;
  const n = 3 + wave;
  for (let i = 0; i < n; i++) spawnAsteroid(3);
  sfx.wave();
}

/* ---------------- 5. Particles (pooled, short-lived) ---------------- */
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(speed * 0.3, speed);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                     life: rand(0.3, 0.9), maxLife: 0.9, color, r: rand(1, 3) });
  }
  if (particles.length > 400) particles.splice(0, particles.length - 400);
}

function shoot() {
  if (state !== 'playing' || !ship) return;
  if (bullets.length > 12) return;
  const s = 420;
  bullets.push({ x: ship.x + Math.cos(ship.angle) * 16,
                 y: ship.y + Math.sin(ship.angle) * 16,
                 vx: Math.cos(ship.angle) * s + ship.vx,
                 vy: Math.sin(ship.angle) * s + ship.vy,
                 radius: 3, life: 1.1 });
  sfx.shoot();
}

/* ---------------- Update (fixed timestep) ---------------- */
function wrap(e) {
  const m = 50;
  if (e.x < -m) e.x = W + m; if (e.x > W + m) e.x = -m;
  if (e.y < -m) e.y = H + m; if (e.y > H + m) e.y = -m;
}

function update(dt) {
  // stars drift slowly downward for parallax life
  for (const st of stars) { st.y += 6 * st.z * dt; if (st.y > H) { st.y = 0; st.x = Math.random() * W; } }
  if (state !== 'playing') return;

  // --- ship ---
  const s = ship;
  s.invuln = Math.max(0, s.invuln - dt);
  let thrust = false;
  if (keys.ArrowLeft || keys.KeyA) s.angle -= 4.4 * dt;
  if (keys.ArrowRight || keys.KeyD) s.angle += 4.4 * dt;
  if (keys.ArrowUp || keys.KeyW) thrust = true;
  if (touchSteer) {
    // steer toward finger, always thrusting on touch
    const want = Math.atan2(H * 0.75 - s.y, touchSteer.x - s.x);
    let d = want - s.angle;
    while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
    s.angle += Math.max(-4.4 * dt, Math.min(4.4 * dt, d));
    thrust = true;
  }
  s.thrusting = thrust;
  if (thrust) {
    s.vx += Math.cos(s.angle) * 320 * dt;
    s.vy += Math.sin(s.angle) * 320 * dt;
    burst(s.x - Math.cos(s.angle) * 14, s.y - Math.sin(s.angle) * 14, '#ff9f43', 1, 60);
  }
  s.vx *= (1 - 0.35 * dt); s.vy *= (1 - 0.35 * dt); // drag
  s.x += s.vx * dt; s.y += s.vy * dt;
  wrap(s);

  // --- bullets ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20)
      bullets.splice(i, 1);
  }

  // --- asteroids ---
  for (const a of asteroids) {
    a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.vr * dt;
    wrap(a);
  }

  // --- particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // --- 4. collision: bullets vs asteroids ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      const rr = b.radius + a.radius;
      if (dist2(b, a) < rr * rr) {
        bullets.splice(i, 1);
        asteroids.splice(j, 1);
        burst(a.x, a.y, '#7df9ff', 14, 160);
        sfx.explode();
        score += (4 - a.size) * 100;
        if (a.size > 1) { // split into two smaller
          spawnAsteroid(a.size - 1, a.x, a.y);
          spawnAsteroid(a.size - 1, a.x, a.y);
        }
        updateHUD();
        break;
      }
    }
  }

  // --- collision: ship vs asteroids ---
  if (s.invuln <= 0) {
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      const rr = s.radius + a.radius * 0.85;
      if (dist2(s, a) < rr * rr) {
        burst(s.x, s.y, '#ff5d8f', 30, 220);
        sfx.hit();
        shake = 14;
        lives--;
        updateHUD();
        if (lives <= 0) { gameOver(); }
        else { const ns = newShip(); ns.invuln = 2.5; ship = ns; }
        break;
      }
    }
  }

  if (asteroids.length === 0) nextWave();
}

function gameOver() {
  state = 'gameover';
  document.body.classList.remove('playing');
  fireBtn.classList.remove('playing');
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = 'GAME OVER';
  overlay.querySelector('p').innerHTML =
    'Score <b style="color:#7df9ff">' + score + '</b> — wave ' + wave +
    '.<br>Best ' + hi + '.';
  promptEl.textContent = 'PRESS SPACE OR TAP TO RETRY';
}

/* ---------------- Render ---------------- */
let shake = 0;
function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.3) { ctx.translate(rand(-shake, shake), rand(-shake, shake)); shake *= 0.88; }
  else shake = 0;

  // stars
  for (const st of stars) {
    ctx.globalAlpha = 0.25 + st.z * 0.65;
    ctx.fillStyle = '#bfd9ff';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state === 'playing' || state === 'gameover') {
    // asteroids: jagged neon polygons
    for (const a of asteroids) {
      ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
      ctx.strokeStyle = '#b18cff'; ctx.lineWidth = 2;
      ctx.shadowColor = '#8a5cff'; ctx.shadowBlur = 10;
      ctx.beginPath();
      const n = a.verts.length;
      for (let i = 0; i <= n; i++) {
        const ang = (i / n) * TAU, r = a.radius * a.verts[i % n];
        const px = Math.cos(ang) * r, py = Math.sin(ang) * r;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.stroke(); ctx.restore();
    }
    // bullets
    ctx.fillStyle = '#ffd257'; ctx.shadowColor = '#ffd257'; ctx.shadowBlur = 12;
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, TAU); ctx.fill(); }
    ctx.shadowBlur = 0;
    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // ship (blink while invulnerable)
    if (state === 'playing' && (ship.invuln <= 0 || (performance.now() / 120 | 0) % 2 === 0)) {
      const s = ship;
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.angle);
      ctx.strokeStyle = '#7df9ff'; ctx.lineWidth = 2.5;
      ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(16, 0); ctx.lineTo(-11, 10); ctx.lineTo(-6, 0); ctx.lineTo(-11, -10);
      ctx.closePath(); ctx.stroke();
      if (s.thrusting) { // flame
        ctx.strokeStyle = '#ff9f43'; ctx.shadowColor = '#ff9f43';
        ctx.beginPath(); ctx.moveTo(-11, 5); ctx.lineTo(-11 - rand(8, 18), 0); ctx.lineTo(-11, -5);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.restore();
}

/* ---------------- 1. Fixed-timestep game loop ---------------- */
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25; // no spiral of death on tab-switch
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
overlay.querySelector('h1').textContent = 'NEON DRIFT';
requestAnimationFrame(frame);
</script>
</body>
</html>
